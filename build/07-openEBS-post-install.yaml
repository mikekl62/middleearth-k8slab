###################################################
# Example storage class and persistent volume claim
###################################################
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc-localpv-lvm
parameters:
  storage: "lvm"
  volgroup: "vg_localpv_lvm"
provisioner: local.csi.openebs.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-localpv-lvm
spec:
  storageClassName: sc-localpv-lvm
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi