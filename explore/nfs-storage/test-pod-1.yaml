apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pod-1
spec:
  storageClassName: nfs-standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-1
spec:
  containers:
    - name: test-container-1
      image: busybox
      command:
        - /bin/sh
      args:
        - -c
        - 'while true; do echo "`date` [`hostname`] Hello from test pod." >> /mnt/greet.txt; sleep $(($RANDOM % 5 + 300)); done'
      volumeMounts:
        - mountPath: /mnt
          name: nfs-pvc
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
        limits:
          cpu: 200m
          memory: 200Mi
  restartPolicy: Always
  volumes:
    - name: nfs-pvc
      persistentVolumeClaim:
        claimName: test-pod-1