#
# This is a sample manifest for deployment of a test pod with
# dynamic provisioning of NFS storage in the kubernetes lab environment.
#
apiVersion: v1
kind: Pod
metadata:
  name: test-nfs-storage
spec:
  containers:
    - name: test-nfs-storage
      image: busybox:stable
      command:
        - "/bin/sh"
      args:
        - "-c"
        - "touch /mnt/SUCCESS && exit 0 || exit 1"
      volumeMounts:
        - name: nfs-pvc
          mountPath: /mnt
      resources:
        requests:
          memory: 64Mi
          cpu: 100m
        limits:
          memory: 128Mi
          cpu: 200m
      restartPolicy: Never
  volumes:
    - name: nfs-pvc
      persistentVolumeClaim:
        claimName: test-nfs-storage